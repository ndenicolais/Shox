name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --force

      - name: Ping Supabase Storage (upload dummy file)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e "
          (async () => {
            try {
              const { createClient } = require('@supabase/supabase-js');
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
              const content = Buffer.from('keepalive ' + new Date().toISOString());
              const { error } = await supabase.storage.from('images')
                .upload('keepalive/ping.txt', content, { upsert: true });
              if (error) throw error;
              console.log('Ping Storage upload successful.');
            } catch (err) {
              console.error('Error pinging Supabase Storage:', err.message);
              process.exit(1);
            }
          })();
          "
