plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing: android/key.properties (git-ignored) points to the release
// keystore. Without it, release builds fall back to the debug key.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.ndn21.shox"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.ndn21.shox"
        minSdkVersion 24
        compileSdkVersion 36
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("android/key.properties not found: signing the release build with the debug key.")
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Some plugins bundle prebuilt jniLibs for all ABIs regardless of
    // defaultConfig.ndk.abiFilters, bloating the APK with unused
    // armeabi-v7a/x86_64 native libraries. Force-exclude them since the app
    // only targets arm64-v8a.
    packagingOptions {
        jniLibs {
            excludes += ["lib/armeabi-v7a/**", "lib/x86_64/**", "lib/x86/**"]
        }
    }
}

flutter {
    source = "../.."
}
