name: shox
description: "A digital shoes wardrobe."
publish_to: "none"
version: 4.0.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.2
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  ming_cute_icons: ^0.0.7
  google_sign_in: ^6.1.5
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  supabase_flutter: ^2.8.3
  logger: ^2.5.0
  uuid: ^4.5.1
  intl: ^0.19.0
  intl_utils: ^2.8.7
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.4
  image: ^4.2.0
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  image_gallery_saver_plus: ^4.0.1
  flutter_cache_manager: ^3.4.1
  http: ^1.3.0
  fl_chart: ^0.69.0
  path: ^1.9.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  share_plus: ^10.1.3
  permission_handler: ^11.3.1
  webview_flutter: ^4.8.0
  pdf: ^3.11.0
  device_info_plus: ^11.2.0
  file_picker: ^9.0.2
  screenshot: ^3.0.0
  package_info_plus: ^9.0.0
  image_background_remover: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - config.json
    - assets/fonts/
    - assets/images/

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Montserrat.ttf

    - family: CustomFontBold
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf

    - family: ShoxIcons
      fonts:
        - asset: assets/fonts/ShoxIcons.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_logo.png"
