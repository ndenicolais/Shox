name: shox
description: "A digital shoes wardrobe."
publish_to: "none"
version: 4.1.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  get: ^4.6.6

  # UI / UX
  flutter_screenutil: ^5.9.3
  ming_cute_icons: ^0.0.7
  fl_chart: ^0.69.0
  photo_view: ^0.15.0
  screenshot: ^3.0.0

  # Firebase / Auth
  google_sign_in: ^6.1.5
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_storage: ^12.3.7

  # Networking
  http: ^1.3.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

  # Storage / persistence
  shared_preferences: ^2.3.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Images / media
  image: ^4.2.0
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  image_gallery_saver_plus: ^4.0.1
  image_background_remover: ^2.0.0

  # Files / documents
  pdf: ^3.11.0
  file_picker: ^9.0.2
  share_plus: ^10.1.3

  # Device / platform
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^9.0.0

  # Utils
  logger: ^2.5.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.2
  intl_utils: ^2.8.7
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    # Montserrat with its real weights, used by the theme (and loaded by path in the PDF export).
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

    - family: ShoxIcons
      fonts:
        - asset: assets/fonts/ShoxIcons.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  image_path: "assets/images/app_icon_legacy.png"
  adaptive_icon_background: "#F6EFE5"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
